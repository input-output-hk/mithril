[package]
name = "ratatui-question-answer"
version = "0.1.0"
description = "ratatui question answer example"
authors = ["Clément Turmel <turmel@teragone-solutions.com>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
color-eyre = "0.6.5"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
